logging:
  level:
    org:
      springframework:
        security: DEBUG

server:
  port: 8085

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update
  datasource:
    url: jdbc:postgresql://${JDBC_URL:localhost}:${JDBC_PORT:5432}/${DATABASE_NAME:buyandsell}
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    username: ${SPRING_DATASOURCE_USERNAME:buyandsell}
    password: ${SPRING_DATASOURCE_PASSWORD:buyandsell}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${keycloak.domain}/realms/${keycloak.realm}
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      file-size-threshold: 12MB
cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}
    region:
      static: ${AWS_REGION}
    stack:
      auto: false


application:
  imageForSellFolder: images/sell
  storiesFolder: stories
  businessBannerFolder: business/banner
  businessLogoFolder: business/logo
  defaultFileName: file
  imagesBucket:
    name: buyandsellimages
  storiesBucket:
    name: buyandsellstories
  businessPageBannerBucket:
    name: buyandsellbusinessbanner
  businessPageLogoBucket:
    name: buyandsellbusinesslogo

app:
  name: SandBox task API
  api:
    title: Spring Boot APIs
    version: 1.0.0
    description: Spring Boot APIs description
    base-package: am.devvibes.buyandsell
    contact-name: Norayr Gharibyan
    contact-email: norayrgh@gmail.com
    swagger:
      enable: true

keycloak:
  realm: ${KEYCLOAK_REALM}
  domain: localhost:9081
  adminClientId: ${KEYCLOAK_ADMIN_CLIENT_ID}
  adminClientSecret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
  urls:
    auth: http://${keycloak.domain}

springdoc:
  api-docs:
    path: /api-docs
